plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.modrinth.minotaur' version '2.10.0'
	id 'net.darkhax.curseforgegradle' version '1.3.33'
}

base {
	archivesName = 'framecrafter'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// The MIT licence requires its text to travel with the jar.
jar {
	from('LICENSE') {
		rename { "LICENSE_framecrafter" }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Automated in-game check: ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "framecrafter-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Optional: test alongside Iris + Sodium from a local Prism instance.
//   ./gradlew runClientGameTest -PwithIris
// Uses ../../shader/Filmicsoft/pack unless -PshaderPack=<dir> is given.
if (project.hasProperty('withIris')) {
	def prismMods = "${System.getProperty('user.home')}/Library/Application Support/PrismLauncher/instances/26.3/minecraft/mods"
	def shaderPack = project.findProperty('shaderPack') ?: "${rootDir}/../../shader/Filmicsoft/pack"
	dependencies {
		localRuntime fileTree(dir: prismMods, include: ['iris-fabric-*.jar', 'sodium-fabric-*.jar'])
	}
	tasks.named('runClientGameTest') {
		// The setup below uses file() and ant from the build script, which the configuration cache can't store.
		notCompatibleWithConfigurationCache('copies the shader pack with script helpers')
		doFirst {
			def run = file('build/run/clientGameTest')
			ant.sync(todir: "${run}/shaderpacks/TestPack") { fileset(dir: shaderPack) }
			file("${run}/config").mkdirs()
			file("${run}/config/iris.properties").text = "enableShaders=true\nshaderPack=TestPack\ndisableUpdateMessage=true\n"
		}
	}
}

// Release publishing. Tokens come from the environment, never from files:
//   MODRINTH_TOKEN=... CURSEFORGE_TOKEN=... ./gradlew modrinth publishCurseForge --no-configuration-cache
// Project IDs live in gradle.properties (modrinth_project_id, curseforge_project_id).
def releaseChangelog = providers.gradleProperty('release_changelog').getOrElse("Framecrafter ${project.version}. See https://github.com/sajibsrs/framecrafter/releases/tag/v${project.version}")

modrinth {
	token = providers.environmentVariable('MODRINTH_TOKEN')
	projectId = providers.gradleProperty('modrinth_project_id')
	versionNumber = project.version.toString()
	versionName = "Framecrafter ${project.version}"
	versionType = 'release'
	uploadFile = tasks.named('jar')
	gameVersions = [project.minecraft_version]
	loaders = ['fabric']
	changelog = releaseChangelog
	dependencies {
		required.project 'fabric-api'
	}
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
	notCompatibleWithConfigurationCache('CurseForgeGradle resolves files at execution time')
	dependsOn tasks.named('jar')
	def jarFile = tasks.named('jar').flatMap { it.archiveFile }
	doFirst {
		def projectId = providers.gradleProperty('curseforge_project_id').getOrNull()
		def token = providers.environmentVariable('CURSEFORGE_TOKEN').getOrNull()
		if (!projectId) throw new GradleException('Set curseforge_project_id in gradle.properties')
		if (!token) throw new GradleException('Set the CURSEFORGE_TOKEN environment variable')
		apiToken = token
		def mainFile = upload(projectId, jarFile.get())
		mainFile.displayName = "Framecrafter ${project.version}"
		mainFile.releaseType = 'release'
		mainFile.changelog = releaseChangelog
		mainFile.addGameVersion(project.minecraft_version)
		mainFile.addModLoader('Fabric')
		mainFile.addEnvironment('Client')
		mainFile.addRequirement('fabric-api')
	}
}
